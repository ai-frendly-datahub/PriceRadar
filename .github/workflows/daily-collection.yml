name: Daily Price Collection

on:
  schedule:
    # 매일 오전 9시 (KST 18시 = UTC 9시)
    - cron: '0 9 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: priceradar-collection
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@main"
        pip install -r requirements.txt

    - name: Run collection and generate report
      run: |
        python main.py --mode once --report --config config/config.yaml --sources config/sources.yaml --notifications config/notifications.yaml --snapshot-db --keep-raw-days 180 --keep-report-days 90 --keep-snapshot-days 30

    - name: Generate index.html
      run: |
        python -c "from priceradar.reporter import generate_index_html; from pathlib import Path; generate_index_html(Path('reports'))"

    - name: Run Quality Checks
      if: always()
      run: |
        python scripts/check_quality.py > quality_report.txt 2>&1 || true
        cat quality_report.txt >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Archive Quality Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report-${{ github.run_number }}
        path: quality_report.txt
        retention-days: 30

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: reports/
        retention-days: 30

    - name: Verify dated data artifact
      run: |
        set -euo pipefail
        dates="$(date -u +%F) $(TZ=Asia/Seoul date +%F)"
        found=0
        for d in $dates; do
          if find "data/raw/$d" -type f ! -name ".gitkeep" -print -quit 2>/dev/null | grep -q .; then found=1; fi
          if find "data/snapshots/$d" -type f ! -name ".gitkeep" -print -quit 2>/dev/null | grep -q .; then found=1; fi
          if find "data/daily" -maxdepth 1 -type f -name "$d*" -print -quit 2>/dev/null | grep -q .; then found=1; fi
        done
        if [ "$found" -eq 0 ]; then
          echo "::error::No dated data artifact found for UTC/KST dates: $dates"
          find data -maxdepth 3 -type f \( -path "*/raw/*" -o -path "*/daily/*" -o -path "*/snapshots/*" \) | sort | tail -50 || true
          exit 1
        fi

    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/ reports/ ':(exclude)data/search_index.db*' 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Daily collection: $(date +'%Y-%m-%d')" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
