name: Daily Price Collection

on:
  schedule:
    # 매일 오전 9시 (KST 18시 = UTC 9시)
    - cron: '0 9 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: priceradar-collection
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@main"
        pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Run collection and generate report
      run: |
        python main.py --mode once --report --config config/config.yaml --sources config/sources.yaml --notifications config/notifications.yaml --snapshot-db --keep-raw-days 180 --keep-report-days 90 --keep-snapshot-days 30

    - name: Generate index.html
      run: |
        python -c "from priceradar.reporter import generate_index_html; from pathlib import Path; generate_index_html(Path('reports'))"

    - name: Run Quality Checks
      if: always()
      run: |
        python scripts/check_quality.py > quality_report.txt 2>&1 || true
        cat quality_report.txt >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Archive Quality Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report-${{ github.run_number }}
        path: quality_report.txt
        retention-days: 30

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: reports/
        retention-days: 30

    - name: Record missing notification secret
      # Notification is optional: a missing secret only produces a warning and never blocks data commits.
      continue-on-error: true
      env:
        NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
      run: |
        if [ -z "${NOTIFICATION_WEBHOOK_URL:-}" ]; then
          echo "::warning::NOTIFICATION_WEBHOOK_URL is not set; notifications skipped, data commit continues"
        fi
        PYTHONPATH="$PWD" python scripts/record_missing_secrets.py NOTIFICATION_WEBHOOK_URL || echo "::warning::could not record missing-secret skip; continuing"

    - name: Verify dated data artifact
      run: |
        set -euo pipefail
        dates="$(date -u +%F) $(TZ=Asia/Seoul date +%F)"
        found=0
        for d in $dates; do
          if find "data/raw/$d" -type f ! -name ".gitkeep" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
          if find "data/snapshots/$d" -type f ! -name ".gitkeep" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
          if find "data/daily" -maxdepth 1 -type f -name "$d*" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
        done
        if [ "$found" -eq 0 ]; then
          echo "::error::No non-empty dated data artifact found for UTC/KST dates: $dates"
          find data -maxdepth 3 -type f \( -path "*/raw/*" -o -path "*/daily/*" -o -path "*/snapshots/*" \) | sort | tail -50 || true
          exit 1
        fi
        while IFS= read -r -d '' f; do
          if [ ! -s "$f" ]; then
            echo "::error::${f} is 0 bytes"
            exit 1
          fi
        done < <(find reports data/raw data/daily data/snapshots data -type f ! -name '.gitkeep' ! -name 'search_index.db*' \( -name '*.html' -o -name '*.json' -o -name '*.jsonl' -o -name '*.duckdb' \) -print0 2>/dev/null || true)
        limit=$((100 * 1024 * 1024))
        while IFS= read -r -d '' f; do
          sz=$(stat -c%s "$f")
          if [ "$sz" -ge "$limit" ]; then
            echo "::error::${f} is ${sz} bytes, at or above GitHub's 100 MiB limit"
            exit 1
          fi
        done < <(find data -type f -name '*.duckdb' -print0 2>/dev/null || true)

    - name: Commit and push if changes
      id: commit
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f data/ reports/ ':(exclude)data/search_index.db*' 2>/dev/null || true
        if git diff --quiet && git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Daily collection: $(date +'%Y-%m-%d')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to GitHub Pages
      if: steps.commit.outcome == 'success'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./reports
        user_name: github-actions[bot]
        user_email: github-actions[bot]@users.noreply.github.com
        commit_message: "docs: update radar report"
