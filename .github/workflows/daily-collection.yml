name: Daily Price Collection

on:
  schedule:
    # 매일 오전 9시 (KST 18시 = UTC 9시)
    - cron: '0 9 * * *'
  workflow_dispatch:  # 수동 실행 가능

concurrency:
  group: priceradar-collection
  cancel-in-progress: false

jobs:
  collect-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run collection and generate report
      run: |
        python main.py --mode once --report

    - name: Generate index.html
      run: |
        python -c "from priceradar.reporters.html_reporter import generate_index_html; from pathlib import Path; generate_index_html(Path('docs/reports'))"

    - name: Run Quality Checks
      if: always()
      run: |
        python scripts/check_quality.py > quality_report.txt 2>&1 || true
        cat quality_report.txt >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Archive Quality Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report-${{ github.run_number }}
        path: quality_report.txt
        retention-days: 30

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: docs/reports/
        retention-days: 30

    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/reports/
        git add data/priceradar.duckdb
        git diff --quiet && git diff --staged --quiet || (git commit -m "Daily collection: $(date +'%Y-%m-%d')" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
