name: Radar Crawler (Optimized)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"  # Daily at 00:00 UTC (adjust per project)

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Asia/Seoul
  PYTHON_VERSION: "3.11"

concurrency:
  group: radar-collection
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@main"
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Radar
        run: |
          python main.py --mode once --report --config config/config.yaml --sources config/sources.yaml --notifications config/notifications.yaml --snapshot-db --keep-raw-days 180 --keep-report-days 90 --keep-snapshot-days 30

      - name: Generate index.html
        run: |
          python -c "from priceradar.reporter import generate_index_html; from pathlib import Path; generate_index_html(Path('reports'))"

      - name: Run Quality Checks
        if: always()
        run: |
          python scripts/check_quality.py > quality_report.txt 2>&1 || true
          cat quality_report.txt >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Archive Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_number }}
          path: quality_report.txt
          retention-days: 30

      - name: Record missing notification secret
        # Notification is optional: a missing secret only produces a warning and never blocks data commits.
        continue-on-error: true
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          if [ -z "${NOTIFICATION_WEBHOOK_URL:-}" ]; then
            echo "::warning::NOTIFICATION_WEBHOOK_URL is not set; notifications skipped, data commit continues"
          fi
          PYTHONPATH="$PWD" python scripts/record_missing_secrets.py NOTIFICATION_WEBHOOK_URL || echo "::warning::could not record missing-secret skip; continuing"

      - name: Verify dated data artifact
        run: |
          set -euo pipefail
          dates="$(date -u +%F) $(TZ=Asia/Seoul date +%F)"
          found=0
          for d in $dates; do
            if find "data/raw/$d" -type f ! -name ".gitkeep" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
            if find "data/snapshots/$d" -type f ! -name ".gitkeep" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
            if find "data/daily" -maxdepth 1 -type f -name "$d*" -size +0c -print -quit 2>/dev/null | grep -q .; then found=1; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No non-empty dated data artifact found for UTC/KST dates: $dates"
            find data -maxdepth 3 -type f \( -path "*/raw/*" -o -path "*/daily/*" -o -path "*/snapshots/*" \) | sort | tail -50 || true
            exit 1
          fi
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} is 0 bytes"
              exit 1
            fi
          done < <(find reports data/raw data/daily data/snapshots data -type f ! -name '.gitkeep' ! -name 'search_index.db*' \( -name '*.html' -o -name '*.json' -o -name '*.jsonl' -o -name '*.duckdb' \) -print0 2>/dev/null || true)
          limit=$((100 * 1024 * 1024))
          while IFS= read -r -d '' f; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -ge "$limit" ]; then
              echo "::error::${f} is ${sz} bytes, at or above GitHub's 100 MiB limit"
              exit 1
            fi
          done < <(find data -type f -name '*.duckdb' -print0 2>/dev/null || true)

      - name: Auto-commit data updates
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update radar data [skip ci]"
          file_pattern: "data/ reports/ :(exclude)data/search_index.db*"
          add_options: "-f"
          skip_fetch: false
          skip_checkout: false

      - name: Deploy to GitHub Pages
        if: steps.auto-commit.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reports
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: update radar report"
          cname: ""  # Add custom domain if needed

      - name: Archive DuckDB (30-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-db-${{ github.run_number }}
          path: |
            data/priceradar.duckdb
            data/snapshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Archive reports (30-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Create workflow summary
        if: always()
        run: |
          echo "## 📊 Radar Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "reports/index.html" ]; then
            echo "✅ Report generated successfully" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "data/priceradar.duckdb" ]; then
            SIZE=$(du -h data/priceradar.duckdb | cut -f1)
            echo "✅ Database backed up ($SIZE)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          if [ -z "${NOTIFICATION_WEBHOOK_URL:-}" ]; then
            echo "failure notify skipped; required env NOTIFICATION_WEBHOOK_URL"
            exit 0
          fi
          curl -s -X POST "${NOTIFICATION_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "status": "failure",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }' || true
