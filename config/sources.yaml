  food: "식품"
  living: "생활용품"
  electronics: "가전/디지털"
  beauty: "뷰티"
  baby: "유아"
  pet: "반려동물"
  sports: "스포츠"
  fashion: "패션"
  market: "장터/핫딜"

# 쇼핑몰 매핑
platforms:
  coupang:
    name: "쿠팡"
    domain: "coupang.com"
  naver:
    name: "네이버쇼핑"
    domain: "shopping.naver.com"
  oliveyoung:
