# PriceRadar 데이터 소스 설정
# 다양한 가격 추적/비교 서비스 통합

data_quality:
  priority: P1
  primary_motion: conversion
  weakest_dimension: authority
  required_components:
    canonical_key_fields:
      - source_id
      - platform
      - product_id
      - option_signature
    effective_price_fields:
      - list_price
      - discount_price
      - coupon_value
      - card_benefit
      - shipping_fee
      - effective_price
    event_models:
      - sku_price_snapshot
      - purchase_benefit_snapshot
      - stock_status_transition
  quality_outputs:
    latest: reports/price_quality.json
    dated_pattern: reports/price_YYYYMMDD_quality.json
    tracked_event_models:
      - sku_price_snapshot
      - purchase_benefit_snapshot
      - stock_status_transition
  event_models:
    sku_price_snapshot:
      date_fields:
        - observed_at
        - collected_at
      required_fields:
        - platform
        - product_id
        - option_signature
        - effective_price
    purchase_benefit_snapshot:
      date_fields:
        - observed_at
        - collected_at
      required_fields:
        - platform
        - product_id
        - coupon_value
        - card_benefit
    stock_status_transition:
      date_fields:
        - observed_at
        - collected_at
      required_fields:
        - platform
        - product_id
        - stock_status
  canonical_keys:
    sku:
      - source_id
      - platform
      - product_id
      - option_signature
    price_snapshot:
      - source_id
      - product_id
      - option_signature
      - observed_at
  freshness_sla:
    sku_price_snapshot_hours: 24
    purchase_benefit_snapshot_hours: 24
    stock_status_transition_hours: 12
  quality_gates:
    - 상품명, 옵션, 용량을 canonical SKU key로 정규화
    - 표시가, 할인가, 실구매가, 배송비를 별도 필드로 유지
    - 급격한 가격 변동은 outlier flag와 원문 URL을 함께 기록
    - 공식 브랜드/스토어 후보는 ToS와 파싱 안정성 검증 후 활성화
  next_actions:
    - 공식 브랜드/스토어 source 후보를 검증해 authority 공백을 보완
    - SKU 가격 이력, 재고, 쿠폰/카드혜택을 같은 이벤트 모델로 정렬
    - 가격 outlier와 품절 전환 리포트를 검증 산출물에 포함
  source_contracts:
    default:
      canonical_key_fields:
        - source_id
        - platform
        - product_id
        - url
        - option_signature
      effective_price_fields:
        - list_price
        - discount_price
        - coupon_value
        - card_benefit
        - shipping_fee
        - effective_price
      stock_fields:
        - stock_status
        - sold_out_at
        - restocked_at
      event_models:
        - sku_price_snapshot
        - purchase_benefit_snapshot
        - stock_status_transition
      verification_role: market_price_reference
    overrides:
      fallcent_main:
        verification_role: price_history_reference
      enuri_main:
        verification_role: price_compare_reference
      danawa_browser:
        verification_role: price_compare_reference
      algumon_main:
        event_models:
          - deal_listing
          - purchase_benefit_snapshot
        verification_role: community_deal_reference
      ruliweb_market:
        event_models:
          - deal_listing
          - resale_signal
        verification_role: community_deal_reference
      quasarzone_saleinfo:
        event_models:
          - deal_listing
          - purchase_benefit_snapshot
        verification_role: expert_deal_reference
      clien_albulgumai:
        event_models:
          - deal_listing
          - purchase_benefit_snapshot
        verification_role: community_deal_reference
      fmkorea_hotdeal:
        event_models:
          - deal_listing
          - purchase_benefit_snapshot
        verification_role: community_deal_reference
      dealbada_main:
        event_models:
          - deal_listing
          - purchase_benefit_snapshot
        verification_role: community_deal_reference
  official_source_backlog:
    - id: coupang_brand_store_candidates
      name: Coupang brand/store official pages
      candidate_platform: coupang
      signal_type: official_store
      representative_domains:
        - coupang.com
        - store.coupang.com
      activation_gate: ToS review, selector stability, stock status fidelity
    - id: naver_brand_store_candidates
      name: Naver Brand Store official pages
      candidate_platform: naver
      signal_type: official_store
      representative_domains:
        - brand.naver.com
        - shopping.naver.com/brandstore
      activation_gate: API/browser policy review, option canonicalization
    - id: manufacturer_store_candidates
      name: Manufacturer direct stores
      candidate_platform: manufacturer
      signal_type: manufacturer_direct
      representative_domains:
        - samsung.com
        - lg.com
        - apple.com
      activation_gate: canonical brand mapping and shipping fee extraction

sources:
  # ===== 폴센트 (Fallcent) - 쿠팡 전문 가격 추적 =====
   - id: fallcent_main
     name: "폴센트 메인"
     type: fallcent
     url: "https://fallcent.com/"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_fallcent
     category: all
     description: "폴센트 메인 페이지 - 16개 카테고리 전체 수집 (식품, 생활, 가전, 뷰티 등)"

   # ===== 에누리 (Enuri) - 종합 가격 비교 =====
   - id: enuri_main
     name: "에누리 메인"
     type: enuri
     url: "https://www.enuri.com/"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_enuri
     category: all
     description: "에누리 메인 페이지 - 인기 상품"

   # ===== 알구몬 (Algumon) - 실시간 핫딜 큐레이션 =====
   # 2026-05: SvelteKit SPA 로 재설계되어 /more/* 엔드포인트는 전부 404.
   # SSR 가용 경로는 /n/deal 한 개뿐이며 lazy-load 카드는 수집 불가.
   - id: algumon_main
     name: "알구몬 메인"
     type: algumon
     url: "https://www.algumon.com/"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_algumon
     category: electronics
     request_delay: 1.0
     max_items: 120
     list_endpoints:
       - path: "/n/deal"
         list_type: latest
         max_pages: 6
     description: "알구몬 실시간 핫딜 수집 (/n/deal SSR ?cursor= 페이지네이션, 9건/요청)"

   - id: ruliweb_market
     name: "루리웹 장터"
     type: ruliweb
     url: "https://bbs.ruliweb.com/market/board/1020"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_ruliweb
     category: market
     max_pages: 5
     delay_between_requests: 0.5
     description: "루리웹 장터 게시판 - 게임/IT/디지털 세일 및 중고 거래"

   - id: quasarzone_saleinfo
     name: "퀘이사존 핫딜"
     type: quasarzone
     url: "https://quasarzone.com/bbs/qb_saleinfo"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_quasarzone
     category: electronics
     max_pages: 10
     request_delay: 1.0
     description: "퀘이사존 세일 정보 게시판 - IT/가전/디지털 할인 정보"

   # ===== 클리앙 (Clien) - 알뜰구매 게시판 =====
   - id: clien_albulgumai
     name: "클리앙 알뜰구매"
     type: clien
     url: "https://www.clien.net/service/board/jirum"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_clien
     category: market
     request_delay: 1.0
     max_items: 100
     max_pages: 5
     description: "클리앙 알뜰구매 게시판 - 핫딜 정보"

   # ===== 펨코 (FMKorea) - 핫딜 게시판 =====
   - id: fmkorea_hotdeal
     name: "펨코 핫딜"
     type: fmkorea
     url: "https://www.fmkorea.com/hotdeal"
     enabled: false
     disabled_reason: "robots_txt_block_and_cloudflare_turnstile_2026-05-15 - fmkorea robots.txt explicitly disallows /hotdeal for general bots; no public RSS/sitemap channel exists; re-enable only with official partner API or explicit written consent. See _workspace/2026-05-14_collection_pipeline_check/91_followup_decision_audit.md"
     trust_tier: T2_expert
     collector_type: C3_fmkorea
     category: market
     request_delay: 1.0
     max_items: 200
     max_pages: 10
     description: "펨코 핫딜 게시판 - 여성 커뮤니티 기반 핫딜 정보"

   # ===== 딜바다 (Dealbada) - 핫딜 정보 =====
   - id: dealbada_main
     name: "딜바다"
     type: dealbada
     url: "https://www.dealbada.com/bbs/board.php?bo_table=deal_domestic"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_dealbada
     category: market
     request_delay: 1.0
     max_items: 100
     max_pages: 5
     description: "딜바다 - 다양한 쇼핑몰의 핫딜 정보 통합"

   - id: danawa_browser
     name: "다나와 가격비교"
     type: danawa
     url: "https://prod.danawa.com/list/?cate=112758"
     enabled: true
     trust_tier: T2_expert
     collector_type: C3_browser
     category: electronics
     timeout: 22000
     wait_for: ".main_prodlist li.prod_item"
     title_selector: ".prod_name a"
     content_selector: ".main_prodlist"
     link_selector: ".main_prodlist li.prod_item .prod_name a"
     description: "Task 7 JS source: Danawa JS-rendered product list"

   - id: ppomppu_browser
     name: "뽐뿌 핫딜"
     type: ppomppu
     url: "https://www.ppomppu.co.kr/zboard/zboard.php?id=ppomppu"
     enabled: false
     trust_tier: T2_expert
     collector_type: C3_browser
     category: market
     timeout: 20000
     wait_for: "#revolution_main_table tbody tr"
     title_selector: ".baseList-title a"
     content_selector: "#revolution_main_table"
     link_selector: "#revolution_main_table tbody tr .baseList-title a"
     description: "Task 7 JS source: Ppomppu deal board"

